{% extends "base.html" %}
{% block title %}{{ t('login_title') }}{% endblock %}
{% block content %}
<section class="box narrow">
  <h1>{{ t('login_title') }}</h1>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
    <label for="username">{{ t('f_username') }}</label>
    <input id="username" name="username" required autocomplete="username" maxlength="40"
           placeholder="{{ t('f_login_ph') }}">
    <label for="password">{{ t('f_password') }}</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <div class="buttons">
      <button class="btn btn-primary btn-block" type="submit">{{ t('f_login') }}</button>
    </div>
  </form>

  <p class="small center gap-top">
    {{ t('no_account') }} <a href="{{ url_for('register') }}">{{ t('nav_register') }}</a>
  </p>

</section>
{% endblock %}
